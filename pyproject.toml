[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-context-dumper"
version = "2.0.0"
description = "Deterministic AI context dumper with PySide6 desktop GUI and CLI modes."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.5.0,<7.0.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]